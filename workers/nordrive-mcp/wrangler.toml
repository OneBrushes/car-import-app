# Worker "nordrive-mcp": servidor MCP de "Guardados por Claude". Pasos de despliegue en README.md
name = "nordrive-mcp"
main = "src/index.ts"
account_id = "f757a66fedd75ffc18548d16eb41abba"   # cuenta infonordrive
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[vars]
# URL pública del Worker, sin barra final. Cámbiala si usas un dominio propio (p. ej. https://mcp.nordrivecars.com)
PUBLIC_URL = "https://nordrive-mcp.infonordrive.workers.dev"
SUPABASE_URL = "https://luzacvchtxkurisuywic.supabase.co"
# Notificaciones push: clave pública VAPID (la privada es el secreto VAPID_PRIVATE_KEY). Se generan con node scripts/generar-vapid.mjs
VAPID_PUBLIC_KEY = "BNNC4zvxH0BTeTZ0OanZJ3Fe5hyE44mVEPBwVda0-z4vdWrj0cOgn_EnFmWAjsqQpkjQump-Vzl4NdppCRFCeXA"

# Secretos (no van aquí): npx wrangler secret put MCP_SECRET / SUPABASE_SERVICE_ROLE_KEY / LOCAL_REVIEW_TOKEN / VAPID_PRIVATE_KEY

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "94265d2988b34768a127eaa47ee3e9b4"

# Revisión diaria de anuncios (src/revision.ts): cada 5 min de 04:00 a 05:59 UTC; el código solo actúa a las 6 de Madrid
# (12 tandas de 15 coches = 180 coches al día como mucho, sin contar mobile.de)
[triggers]
crons = ["*/5 4,5 * * *"]

[observability]
enabled = true
